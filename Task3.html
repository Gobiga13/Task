<!DOCTYPE html>
<html>
<head>
<style>
ul {
    list-style: none;
    padding: 0;
}

li {
    font-size: 20px;
    margin: 10px 0;
}

li::before {
    content: "★";   
    color: blue;
    margin-right: 10px;
}
</style>
</head>
<body>

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>Python</li>
    <li>Java</li>
</ul>

</body>
</html>
