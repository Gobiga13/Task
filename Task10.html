<!DOCTYPE html>
<html>
<head>
<style>
body{
   text-align: center;
   margin-top: 50px;
   font-family: Arial;
}

.badge{
   display: inline-block;
   padding: 10px 20px;
   border-radius: 30px;
   color: white;
   font-size: 15px;
   margin: 10px;
}

.success{
   background-color: green;
}

.warning{
   background-color: orange;
}

.error{
   background-color: red;
}
</style>
</head>
<body>

<span class="badge success">✓ Success</span>

<span class="badge warning">⚠ Warning</span>

<span class="badge error">✕ Error</span>

</body>
</html>
