<!DOCTYPE html>
<html>
<head>
<style>
body{
   font-family: Arial;
   padding: 40px;
}

.progress-box{
   width: 400px;
}

.progress-bar{
   width: 100%;
   height: 30px;
   background: lightgray;
   border-radius: 20px;
   overflow: hidden;
}

.fill{
   height: 100%;
   width: 0;
   background: green;
   text-align: center;
   line-height: 30px;
   color: white;
   border-radius: 20px;
   animation: load 3s forwards;
}

@keyframes load{
   from{
      width: 0;
   }
   to{
      width: 75%;
   }
}
</style>
</head>
<body>

<div class="progress-box">
   <h3>Loading Progress</h3>

   <div class="progress-bar">
      <div class="fill">75%</div>
   </div>
</div>

</body>
</html>
