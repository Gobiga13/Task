<!DOCTYPE html>
<html>
<head>
<style>
body{
   margin:0;
   font-family: Arial;
}

.header{
   background:#333;
   color:white;
   display:flex;
   justify-content:space-between;
   align-items:center;
   padding:15px 20px;
}

.logo{
   font-size:24px;
   font-weight:bold;
}

.menu{
   display:flex;
   gap:20px;
}

.menu a{
   color:white;
   text-decoration:none;
}

#check{
   display:none;
}

.icon{
   display:none;
   font-size:28px;
   cursor:pointer;
}

/* Mobile View */
@media(max-width:768px){

   .icon{
      display:block;
   }

   .menu{
      display:none;
      flex-direction:column;
      position:absolute;
      top:60px;
      left:0;
      width:100%;
      background:#444;
      padding:10px 0;
      text-align:center;
   }

   #check:checked ~ .menu{
      display:flex;
   }
}
</style>
</head>

<body>

<header class="header">

   <div class="logo">MyLogo</div>

   <input type="checkbox" id="check">

   <label for="check" class="icon">
      ☰
   </label>

   <nav class="menu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
   </nav>

</header>

</body>
</html>
